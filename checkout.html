<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - K-market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="checkout-page">
    <!-- Left Side: Branding & Info -->
    <div class="checkout-left">
      <div class="logo">
        <a href="index.html" style="display: flex; align-items: center; gap: 15px; text-decoration: none;">
          <img src="logo.png" alt="K-market Logo" style="height: 40px;" />
          <span class="logo-text">K-market</span>
        </a>
      </div>
      <h1 class="checkout-title">Payment <br> Checkout.</h1>
      
    </div>

    <!-- Right Side: Payment Form Card -->
    <div class="checkout-right">
      <div class="checkout-card">
        <h2>Payment</h2>

        <form class="payment-section" onsubmit="event.preventDefault(); showToast('Payment successful!'); setTimeout(() => window.location.href='index.html', 2000);">
          <div class="pay-with-group">
            <p>Pay With:</p>
            <div class="radio-group">
              <label class="radio-label active">
                <input type="radio" name="pay-method" checked />
                Card
              </label>
              <label class="radio-label">
                <input type="radio" name="pay-method" />
                Bank
              </label>
              <label class="radio-label">
                <input type="radio" name="pay-method" />
                Transfer
              </label>
            </div>
          </div>

          <div class="input-group">
            <label for="card-number">Card Number</label>
            <input type="text" id="card-number" placeholder="1234 5678 9101 1121" required />
          </div>

          <div class="input-row">
            <div class="input-group">
              <label for="expiry">Expiration Date</label>
              <input type="text" id="expiry" placeholder="MM/YY" required />
            </div>
            <div class="input-group">
              <label for="cvv">CVV</label>
              <input type="text" id="cvv" placeholder="123" required />
            </div>
          </div>

          <div class="save-card-group" style="margin-top: 10px;">
            <input type="checkbox" id="save-card" />
            <label for="save-card">Save card details</label>
          </div>

          <button type="submit" class="btn-pay-green" id="btn-pay">Pay Now</button>

          <p class="checkout-disclaimer">
            Your personal data will be used to process your order, support your experience throughout this website, and for other purposes described in our privacy policy.
          </p>
        </form>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
