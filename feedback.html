<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session Feedback - K-market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <!-- ════════════════════════════ NAVBAR ═══════════════════════════ -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">
        <img src="logo.png" alt="K-market Logo" class="logo-img" />
        <span class="logo-text">K-market</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html#products" class="nav-link">Shop</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="contact.html" class="nav-link">Contact</a>
        <a href="feedback.html" class="nav-link active">Feedback</a>
      </nav>

      <div class="nav-actions">
        <a href="login.html" class="nav-icon-btn" id="btn-user" aria-label="Account">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
          </svg>
        </a>

        <button class="nav-icon-btn cart-btn" id="btn-cart" aria-label="Cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
            <line x1="3" y1="6" x2="21" y2="6" />
            <path d="M16 10a4 4 0 0 1-8 0" />
          </svg>
          <span class="cart-badge" id="cart-badge">0</span>
        </button>

        <button class="hamburger" id="hamburger" aria-label="Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="feedback-page">
    <div class="feedback-container">
      <div class="feedback-header">
        <h1>Session feedback</h1>
        <p>Please rate your experience below</p>
      </div>

      <form class="feedback-form"
        onsubmit="event.preventDefault(); showToast('Thank you for your feedback!'); setTimeout(() => window.location.href='index.html', 2000);">
        <div class="rating-section">
          <div class="stars">
            <input type="radio" id="star5" name="rating" value="5" /><label for="star5"></label>
            <input type="radio" id="star4" name="rating" value="4" checked /><label for="star4"></label>
            <input type="radio" id="star3" name="rating" value="3" /><label for="star3"></label>
            <input type="radio" id="star2" name="rating" value="2" /><label for="star2"></label>
            <input type="radio" id="star1" name="rating" value="1" /><label for="star1"></label>
          </div>

        </div>

        <div class="feedback-field">
          <label>Additional feedback</label>
          <textarea placeholder="My feedback!!"></textarea>
        </div>

        <button type="submit" class="btn-submit-feedback">Submit feedback</button>

        <div class="feedback-actions">
          <a href="index.html" class="btn-action-outline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Home
          </a>
        </div>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
