<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Sign up - K-market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-left auth-img-col">
        <div class="auth-img-wrap">
          <img src="signup.png" alt="Sign Up Illustration" onerror="this.src='logo.png'; this.style.opacity='0.1';">
        </div>
      </div>

      <div class="auth-right">
        <div class="auth-form-wrap">
          <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
            <a href="index.html" class="auth-logo" style="margin-bottom: 0;">
              <img src="logo.png" alt="K-market">
            </a>
          </div>

          <div class="auth-header">
            <h1 class="auth-title">Sign up</h1>
            <p class="auth-subtitle">Let's get you all set up so you can access your personal account.</p>
          </div>

          <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='index.html';">
            <div class="form-row">
              <div class="form-group-outline">
                <input type="text" id="firstname" required placeholder=" " value="john.doe@gmail.com">
                <label for="firstname">First Name</label>
              </div>
              <div class="form-group-outline">
                <input type="text" id="lastname" required placeholder=" " value="john.doe@gmail.com">
                <label for="lastname">Last Name</label>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group-outline">
                <input type="email" id="email" required placeholder=" " value="john.doe@gmail.com">
                <label for="email">Email</label>
              </div>
              <div class="form-group-outline">
                <input type="tel" id="phone" required placeholder=" " value="john.doe@gmail.com">
                <label for="phone">Phone Number</label>
              </div>
            </div>

            <div class="form-group-outline">
              <input type="password" id="password" required placeholder=" " value="••••••••••••••">
              <label for="password">Password</label>
              <button type="button" class="password-toggle" aria-label="Toggle password visibility"
                onclick="const p = document.getElementById('password'); p.type = p.type === 'password' ? 'text' : 'password';">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <line x1="2" y1="2" x2="22" y2="22"></line>
                </svg>
              </button>
            </div>

            <div class="form-group-outline">
              <input type="password" id="confirm_password" required placeholder=" " value="••••••••••••••">
              <label for="confirm_password">Confirm Password</label>
              <button type="button" class="password-toggle" aria-label="Toggle password visibility"
                onclick="const p = document.getElementById('confirm_password'); p.type = p.type === 'password' ? 'text' : 'password';">
                <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <line x1="2" y1="2" x2="22" y2="22"></line>
                </svg>
              </button>
            </div>

            <div class="auth-options" style="justify-content: flex-start;">
              <label class="auth-checkbox">
                <input type="checkbox" required>
                <span>I agree to all the <a href="#" class="auth-link">Terms</a> and <a href="#"
                    class="auth-link">Privacy Policies</a></span>
              </label>
            </div>

            <button type="submit" class="btn-auth">Create account</button>

            <div class="auth-footer">
              Already have an account? <a href="login.html" class="auth-link">Login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
